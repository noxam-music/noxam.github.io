<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoxAm — Archive</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #071315;
            color: #d8e3e2;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 28px 7vw;
            border-bottom: 1px solid rgba(74, 180, 177, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #72c9c4;
        }

        nav a {
            color: #a8bdbc;
            text-decoration: none;
            margin-left: 28px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #e5a84b;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 80px 7vw;
        }

        .intro {
            max-width: 760px;
        }

        .classification {
            color: #e5a84b;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: clamp(52px, 9vw, 110px);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: -4px;
            color: #e4eeee;
        }

        .description {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.7;
            color: #9eb0af;
        }

        .archive-link {
            display: inline-block;
            margin-top: 36px;
            padding: 14px 22px;
            border: 1px solid #3b8f8b;
            color: #72c9c4;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .archive-link:hover {
            background: #72c9c4;
            color: #071315;
        }

        footer {
            padding: 22px 7vw;
            border-top: 1px solid rgba(74, 180, 177, 0.12);
            color: #627473;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 700px) {
            header {
                padding: 22px 6vw;
            }

            nav a {
                margin-left: 14px;
                font-size: 12px;
            }

            main {
                padding: 60px 6vw;
            }

            footer {
                padding: 18px 6vw;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="logo">NOXAM</div>

        <nav>
            <a href="#">ARCHIVE</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <main>
        <section class="intro">

            <div class="classification">
                Digital Archive / Original Music
            </div>

            <h1>NoxAm</h1>

            <div class="description">
                Музыка, тексты и следы их создания.
                Независимый архив оригинальных произведений
                на пересечении человеческого творчества и технологий.
            </div>

         <a class="archive-link" archive.html>
                Enter the archive →
            </a>

        </section>
    </main>

    <footer>
        <span>NoxAm / Roman Popov</span>
        <span>Human created / AI assisted</span>
    </footer>

</div>

</body>
</html>
