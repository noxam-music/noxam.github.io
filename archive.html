<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.webp">
    <title>Archive — NoxAm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #d8e3e2;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 28px 7vw;
            border-bottom: 1px solid rgba(74, 180, 177, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #72c9c4;
            text-decoration: none;
        }

        nav a {
            color: #a8bdbc;
            text-decoration: none;
            margin-left: 28px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #e5a84b;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 7vw;
        }

        .classification {
            color: #e5a84b;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 60px 0;
            font-size: clamp(48px, 8vw, 90px);
            line-height: 0.95;
            letter-spacing: -3px;
            color: #e4eeee;
        }

        .year {
            margin-top: 50px;
            margin-bottom: 18px;
            color: #627473;
            font-size: 13px;
            letter-spacing: 3px;
        }

        .track {
            border-top: 1px solid rgba(74, 180, 177, 0.18);
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Блок с миниатюрой и текстом трека */
        .track-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .track-thumb {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(74, 180, 177, 0.25);
            display: block;
            flex-shrink: 0;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .track-thumb:hover {
            transform: scale(1.04);
            border-color: #e5a84b;
        }

        .track-info h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 500;
            color: #dce8e7;
        }

        .track-info p {
            margin: 0;
            color: #718584;
            font-size: 13px;
        }

        .open {
            color: #72c9c4;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .open:hover {
            color: #e5a84b;
        }

        footer {
            margin-top: 80px;
            padding: 22px 7vw;
            border-top: 1px solid rgba(74, 180, 177, 0.12);
            color: #627473;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 700px) {
            header {
                padding: 22px 6vw;
            }

            nav a {
                margin-left: 14px;
                font-size: 12px;
            }

            main {
                padding: 60px 6vw;
            }

            .track {
                align-items: flex-start;
                gap: 20px;
            }

            .track-left {
                gap: 16px;
            }

            .track-thumb {
                width: 52px;
                height: 52px;
            }

            footer {
                padding: 18px 6vw;
                gap: 20px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <a class="logo" href="index.html">NOXAM</a>
    <nav>
        <a href="archive.html">ARCHIVE</a>
        <a href="#">ABOUT</a>
    </nav>
</header>

<main>
    <div class="classification">
        NoxAm / Digital Archive
    </div>

    <h1>Archive</h1>

    <div class="year">2026</div>

    <div class="track">
        <div class="track-left">
            <!-- Миниатюра обложки со ссылкой на релиз -->
            <a href="pyanyj-vecher.html">
                <img class="track-thumb" src="images/Obl-PianVech.webp" alt="Обложка трека Пьяный вечер" loading="lazy">
            </a>

            <div class="track-info">
                <h2>Пьяный вечер</h2>
                <p>Original song / Lyrics & melody by Roman Popov</p>
            </div>
        </div>

        <a class="open" href="pyanyj-vecher.html">
            OPEN →
        </a>
    </div>
</main>

<footer>
    <span>NoxAm / Roman Popov</span>
    <span>Human created / AI assisted</span>
</footer>

</body>
</html>
